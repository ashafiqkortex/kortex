<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720" role="img" aria-label="Before and after: the same roles shift from admin work to real work">
  <defs><pattern id="dg4" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#C15F3C" stroke-opacity="0.05"/></pattern>
  <marker id="ar4" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#C15F3C"/></marker></defs>
  <rect width="1600" height="720" fill="#F0EEE6"/><rect width="1600" height="720" fill="url(#dg4)"/>

  <text x="120" y="120" font-family="ui-monospace,monospace" font-size="20" letter-spacing="3" fill="#8A887F">BEFORE</text>
  <text x="1090" y="120" font-family="ui-monospace,monospace" font-size="20" letter-spacing="3" fill="#A8492A">AFTER · SAME CREW</text>

  <!-- arrow across -->
  <line x1="700" y1="380" x2="900" y2="380" stroke="#C15F3C" stroke-width="3" marker-end="url(#ar4)"/>

  <g font-family="ui-monospace,monospace" font-size="20">
    <!-- before column -->
    <g fill="#54524B">
      <rect x="120" y="190" width="500" height="90" rx="12" fill="#FAF9F4" stroke="#D8D3C2" stroke-width="2"/><text x="150" y="243">Dispatcher → data entry</text>
      <rect x="120" y="310" width="500" height="90" rx="12" fill="#FAF9F4" stroke="#D8D3C2" stroke-width="2"/><text x="150" y="363">Office mgr → copying records</text>
      <rect x="120" y="430" width="500" height="90" rx="12" fill="#FAF9F4" stroke="#D8D3C2" stroke-width="2"/><text x="150" y="483">Techs → paperwork in the truck</text>
    </g>
    <!-- after column -->
    <g fill="#191815">
      <rect x="980" y="190" width="500" height="90" rx="12" fill="#FAF9F4" stroke="#C15F3C" stroke-width="2"/><text x="1010" y="243">Dispatcher → dispatching</text>
      <rect x="980" y="310" width="500" height="90" rx="12" fill="#FAF9F4" stroke="#C15F3C" stroke-width="2"/><text x="1010" y="363">Office mgr → managing customers</text>
      <rect x="980" y="430" width="500" height="90" rx="12" fill="#FAF9F4" stroke="#C15F3C" stroke-width="2"/><text x="1010" y="483">Techs → billable work</text>
    </g>
  </g>
  <text x="800" y="640" font-family="Georgia,serif" font-style="italic" font-size="24" fill="#A8492A" text-anchor="middle">Same people. Roughly 2x the output. Zero new hires.</text>
</svg>
