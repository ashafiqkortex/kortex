<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-label="Paperwork draining into a funnel of lost money">
  <defs>
    <pattern id="g4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#C15F3C" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="r4" cx="50%" cy="22%" r="70%">
      <stop offset="0%" stop-color="#C15F3C" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#C15F3C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="800" fill="#F0EEE6"/>
  <rect width="1600" height="800" fill="url(#g4)"/>
  <rect width="1600" height="800" fill="url(#r4)"/>

  <!-- stacked documents entered three times -->
  <g stroke="#C15F3C" stroke-width="2.5" fill="#FAF9F4">
    <rect x="560" y="150" width="200" height="120" rx="8"/>
    <rect x="700" y="180" width="200" height="120" rx="8"/>
    <rect x="840" y="210" width="200" height="120" rx="8"/>
  </g>
  <g stroke="#A8492A" stroke-width="2" opacity="0.5">
    <line x1="585" y1="190" x2="735" y2="190"/><line x1="585" y1="220" x2="715" y2="220"/>
    <line x1="725" y1="220" x2="875" y2="220"/><line x1="725" y1="250" x2="855" y2="250"/>
    <line x1="865" y1="250" x2="1015" y2="250"/><line x1="865" y1="280" x2="995" y2="280"/>
  </g>
  <text x="800" y="120" font-family="ui-monospace, monospace" font-size="17" letter-spacing="2" fill="#54524B" text-anchor="middle">SAME CUSTOMER · 3 SYSTEMS</text>

  <!-- funnel draining -->
  <path d="M620 380 L 980 380 L 860 560 L 740 560 Z" fill="none" stroke="#C15F3C" stroke-width="2.5"/>
  <g stroke="#A8492A" stroke-width="3" stroke-linecap="round">
    <line x1="800" y1="580" x2="800" y2="640"/>
    <line x1="770" y1="600" x2="770" y2="650"/>
    <line x1="830" y1="600" x2="830" y2="650"/>
  </g>
  <text x="800" y="710" font-family="Georgia, serif" font-style="italic" font-size="38" fill="#A8492A" text-anchor="middle">$20K / tech / yr</text>
</svg>
