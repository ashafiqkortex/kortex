<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-label="A rented box weighed against an owned custom system">
  <defs>
    <pattern id="g5" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#C15F3C" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="r5" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#C15F3C" stop-opacity="0.09"/>
      <stop offset="60%" stop-color="#C15F3C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="800" fill="#F0EEE6"/>
  <rect width="1600" height="800" fill="url(#g5)"/>
  <rect width="1600" height="800" fill="url(#r5)"/>

  <!-- balance beam -->
  <line x1="800" y1="180" x2="800" y2="250" stroke="#54524B" stroke-width="3"/>
  <line x1="380" y1="250" x2="1220" y2="250" stroke="#54524B" stroke-width="3"/>
  <circle cx="800" cy="250" r="10" fill="#54524B"/>

  <!-- left pan: rented (dashed, hollow) -->
  <line x1="380" y1="250" x2="380" y2="360" stroke="#8A887F" stroke-width="2"/>
  <rect x="280" y="360" width="200" height="150" rx="12" fill="none" stroke="#8A887F" stroke-width="2.5" stroke-dasharray="8 8"/>
  <text x="380" y="450" font-family="ui-monospace, monospace" font-size="16" letter-spacing="2" fill="#8A887F" text-anchor="middle">RENTED</text>
  <text x="380" y="560" font-family="ui-monospace, monospace" font-size="15" fill="#8A887F" text-anchor="middle">$20K / yr · forever</text>

  <!-- right pan: owned (solid clay) -->
  <line x1="1220" y1="250" x2="1220" y2="360" stroke="#A8492A" stroke-width="2"/>
  <rect x="1120" y="360" width="200" height="170" rx="12" fill="#A8492A"/>
  <text x="1220" y="455" font-family="ui-monospace, monospace" font-size="16" letter-spacing="2" fill="#F0EEE6" text-anchor="middle">OWNED</text>
  <text x="1220" y="585" font-family="ui-monospace, monospace" font-size="15" fill="#A8492A" text-anchor="middle">$40–80K · once</text>
</svg>
