<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760" role="img" aria-label="Five tools all feeding into one office manager who is the manual integration layer">
  <defs><pattern id="dg3" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#C15F3C" stroke-opacity="0.05"/></pattern>
  <marker id="ar3" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#C15F3C"/></marker></defs>
  <rect width="1600" height="760" fill="#F0EEE6"/><rect width="1600" height="760" fill="url(#dg3)"/>
  <text x="120" y="90" font-family="ui-monospace,monospace" font-size="20" letter-spacing="3" fill="#A8492A">YOUR STACK TODAY</text>

  <!-- 5 tools -->
  <g font-family="ui-monospace,monospace" font-size="18" text-anchor="middle" fill="#191815">
    <rect x="120" y="160" width="220" height="80" rx="12" fill="#FAF9F4" stroke="#C15F3C" stroke-width="2"/><text x="230" y="208">Jobber</text>
    <rect x="400" y="160" width="220" height="80" rx="12" fill="#FAF9F4" stroke="#C15F3C" stroke-width="2"/><text x="510" y="208">Housecall</text>
    <rect x="680" y="160" width="220" height="80" rx="12" fill="#FAF9F4" stroke="#C15F3C" stroke-width="2"/><text x="790" y="208">ServiceTitan</text>
    <rect x="960" y="160" width="220" height="80" rx="12" fill="#FAF9F4" stroke="#C15F3C" stroke-width="2"/><text x="1070" y="208">QuickBooks</text>
    <rect x="1240" y="160" width="220" height="80" rx="12" fill="#FAF9F4" stroke="#C15F3C" stroke-width="2"/><text x="1350" y="208">CompanyCam</text>
  </g>
  <!-- arrows down to hub -->
  <g stroke="#C15F3C" stroke-width="2" fill="none" marker-end="url(#ar3)">
    <path d="M230 240 C 230 380, 800 360, 800 470"/>
    <path d="M510 240 C 510 380, 800 380, 800 470"/>
    <path d="M790 240 L 800 470"/>
    <path d="M1070 240 C 1070 380, 800 380, 800 470"/>
    <path d="M1350 240 C 1350 380, 800 360, 800 470"/>
  </g>
  <!-- the human hub -->
  <rect x="560" y="480" width="480" height="120" rx="16" fill="#A8492A"/>
  <text x="800" y="530" font-family="ui-monospace,monospace" font-size="22" fill="#F0EEE6" text-anchor="middle">OFFICE MANAGER</text>
  <text x="800" y="566" font-family="ui-monospace,monospace" font-size="16" fill="#F0EEE6" fill-opacity="0.8" text-anchor="middle">= the manual integration layer</text>
  <text x="800" y="660" font-family="Georgia,serif" font-style="italic" font-size="22" fill="#54524B" text-anchor="middle">Five logins. One human re-typing between them.</text>
</svg>
