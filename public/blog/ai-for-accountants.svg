<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-label="Individual accountants using AI tools separately, against one firm-wide system">
  <defs>
    <pattern id="g1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#C15F3C" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="r1" cx="72%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#C15F3C" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#C15F3C" stop-opacity="0"/>
    </radialGradient>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#A8492A"/>
    </marker>
  </defs>

  <rect width="1600" height="800" fill="#F0EEE6"/>
  <rect width="1600" height="800" fill="url(#g1)"/>
  <rect width="1600" height="800" fill="url(#r1)"/>

  <!-- LEFT: scattered individual usage -->
  <text x="140" y="170" font-family="Georgia, serif" font-size="26" fill="#8A8578">Everyone has a tab open</text>
  <g fill="none" stroke="#C9C3B4" stroke-width="2">
    <rect x="140" y="220" width="150" height="86" rx="12"/>
    <rect x="320" y="270" width="150" height="86" rx="12"/>
    <rect x="140" y="380" width="150" height="86" rx="12"/>
    <rect x="320" y="430" width="150" height="86" rx="12"/>
  </g>
  <g font-family="Georgia, serif" font-size="17" fill="#8A8578" text-anchor="middle">
    <text x="215" y="270">tax research</text>
    <text x="395" y="320">drafting</text>
    <text x="215" y="430">summaries</text>
    <text x="395" y="480">email</text>
  </g>
  <text x="140" y="590" font-family="Georgia, serif" font-size="20" fill="#8A8578">Nothing compounds.</text>

  <line x1="620" y1="150" x2="620" y2="640" stroke="#C9C3B4" stroke-width="1" stroke-dasharray="6 8"/>

  <!-- RIGHT: one system -->
  <text x="720" y="170" font-family="Georgia, serif" font-size="26" fill="#A8492A">One system</text>
  <rect x="720" y="300" width="230" height="180" rx="16" fill="#A8492A"/>
  <text x="835" y="378" font-family="Georgia, serif" font-size="23" fill="#F4F1E8" text-anchor="middle">Firm</text>
  <text x="835" y="412" font-family="Georgia, serif" font-size="23" fill="#F4F1E8" text-anchor="middle">workflow</text>

  <g stroke="#A8492A" stroke-opacity="0.5" stroke-width="2" fill="none">
    <line x1="950" y1="340" x2="1090" y2="252" marker-end="url(#ar2)"/>
    <line x1="950" y1="390" x2="1090" y2="390" marker-end="url(#ar2)"/>
    <line x1="950" y1="440" x2="1090" y2="528" marker-end="url(#ar2)"/>
  </g>
  <g font-family="Georgia, serif" font-size="18" fill="#5F5B52">
    <rect x="1098" y="222" width="330" height="60" rx="10" fill="none" stroke="#C9C3B4" stroke-width="2"/>
    <text x="1263" y="259" text-anchor="middle">Same answer every time</text>
    <rect x="1098" y="360" width="330" height="60" rx="10" fill="none" stroke="#C9C3B4" stroke-width="2"/>
    <text x="1263" y="397" text-anchor="middle">Reviewable by a partner</text>
    <rect x="1098" y="498" width="330" height="60" rx="10" fill="none" stroke="#C9C3B4" stroke-width="2"/>
    <text x="1263" y="535" text-anchor="middle">Survives the person leaving</text>
  </g>
  <text x="720" y="590" font-family="Georgia, serif" font-size="20" fill="#8A8578">Capacity, not novelty.</text>
</svg>
