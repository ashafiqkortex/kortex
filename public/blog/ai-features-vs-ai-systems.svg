<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-label="A lone button versus a connected system">
  <defs>
    <pattern id="g2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#C15F3C" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="r2" cx="78%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#C15F3C" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#C15F3C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="800" fill="#F0EEE6"/>
  <rect width="1600" height="800" fill="url(#g2)"/>
  <rect width="1600" height="800" fill="url(#r2)"/>

  <!-- divider -->
  <line x1="560" y1="120" x2="560" y2="680" stroke="#D8D3C2" stroke-width="2" stroke-dasharray="2 10"/>
  <text x="270" y="150" font-family="ui-monospace, monospace" font-size="18" letter-spacing="3" fill="#8A887F">FEATURE</text>
  <text x="1010" y="150" font-family="ui-monospace, monospace" font-size="18" letter-spacing="3" fill="#C15F3C">SYSTEM</text>

  <!-- left: a single disconnected button -->
  <circle cx="280" cy="410" r="70" fill="none" stroke="#A8492A" stroke-width="3"/>
  <circle cx="280" cy="410" r="14" fill="#A8492A"/>

  <!-- right: connected chain of nodes -->
  <g stroke="#C15F3C" stroke-width="2.5" fill="none">
    <path d="M720 410 H 860 M980 410 H 1120 M1240 410 H 1360"/>
    <path d="M920 350 V 290 H 1180 V 350"/>
    <path d="M920 470 V 530 H 1180 V 470"/>
  </g>
  <g fill="#A8492A">
    <circle cx="720" cy="410" r="16"/><circle cx="920" cy="410" r="16"/>
    <circle cx="1120" cy="410" r="16"/><circle cx="1360" cy="410" r="16"/>
    <circle cx="1180" cy="290" r="12"/><circle cx="1180" cy="530" r="12"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="15" fill="#54524B" text-anchor="middle">
    <text x="720" y="455">call</text><text x="920" y="455">book</text>
    <text x="1120" y="455">dispatch</text><text x="1360" y="455">invoice</text>
  </g>
</svg>
