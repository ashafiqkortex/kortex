<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-label="A small team producing expanding output">
  <defs>
    <pattern id="g3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#C15F3C" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="r3" cx="20%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#C15F3C" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#C15F3C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="800" fill="#F0EEE6"/>
  <rect width="1600" height="800" fill="url(#g3)"/>
  <rect width="1600" height="800" fill="url(#r3)"/>

  <!-- small fixed team on the left -->
  <g fill="#A8492A">
    <circle cx="240" cy="330" r="20"/><circle cx="240" cy="400" r="20"/><circle cx="240" cy="470" r="20"/>
  </g>
  <text x="240" y="545" font-family="ui-monospace, monospace" font-size="17" letter-spacing="2" fill="#54524B" text-anchor="middle">SAME CREW</text>

  <!-- expanding output arcs -->
  <g stroke="#C15F3C" fill="none" stroke-width="2.5" opacity="0.9">
    <path d="M300 400 C 600 400, 800 250, 1120 250"/>
    <path d="M300 400 C 600 400, 820 330, 1200 330"/>
    <path d="M300 400 C 640 400, 980 400, 1320 400"/>
    <path d="M300 400 C 600 400, 820 470, 1200 470"/>
    <path d="M300 400 C 600 400, 800 550, 1120 550"/>
  </g>
  <g fill="#C15F3C">
    <circle cx="1120" cy="250" r="8"/><circle cx="1200" cy="330" r="8"/>
    <circle cx="1320" cy="400" r="11"/><circle cx="1200" cy="470" r="8"/><circle cx="1120" cy="550" r="8"/>
  </g>
  <text x="1360" y="408" font-family="Georgia, serif" font-style="italic" font-size="40" fill="#A8492A">2x</text>
</svg>
